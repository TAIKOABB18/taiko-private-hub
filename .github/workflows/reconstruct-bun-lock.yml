name: Reconstruct bun.lock

on:
  push:
    branches: [main]
    paths:
      - '.bunlock/**'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact bun.lock
        shell: bash
        run: |
          set -euo pipefail
          cat .bunlock/part00 .bunlock/part01 .bunlock/part02 .bunlock/part03 > /tmp/bun.lock.gz.b64
          base64 --decode /tmp/bun.lock.gz.b64 | gzip --decompress > bun.lock
          echo '2e2c210a9b110f62b0415c6c489af7f3149f4f534d7295b59d858242392a4a42  bun.lock' | sha256sum --check --strict
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'Restore exact bun.lock from source package'
          git push
